<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Khitanan Reynand</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Kaushan+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

<div class="pin-gate" id="pinGate">
    <form class="pin-box" id="formPIN">
        <h2>Panel Admin</h2>
        <small>PIN default: 1234</small>
        <input type="password" id="pinInput" inputmode="numeric" maxlength="12" placeholder="••••" required>
        <button type="submit">Masuk</button>
    </form>
</div>

<div class="admin-container hidden" id="adminMain">
    <div class="admin-header">
        <h1>🌹 Admin Khitanan Reynand</h1>
        <div class="admin-actions">
            <a class="admin-btn btn-maroon" href="index.html" target="_blank"><i class="fas fa-eye"></i> Lihat Undangan</a>
            <button class="admin-btn btn-export" id="btnExport"><i class="fas fa-file-csv"></i> Export CSV</button>
            <button class="admin-btn btn-clear" id="btnClearAll"><i class="fas fa-trash"></i> Hapus Semua</button>
            <button class="admin-btn" style="background:#6c757d;color:#fff" id="btnLogout"><i class="fas fa-right-from-bracket"></i> Keluar</button>
        </div>
    </div>

    <div class="admin-stats">
        <div class="stat-card"><h3>Total RSVP</h3><p id="stTotal">0</p></div>
        <div class="stat-card"><h3>Hadir</h3><p id="stHadir">0</p></div>
        <div class="stat-card"><h3>Berhalangan</h3><p id="stTidak">0</p></div>
        <div class="stat-card"><h3>Estimasi Tamu</h3><p id="stTamu">0</p></div>
        <div class="stat-card"><h3>Ucapan</h3><p id="stWish">0</p></div>
    </div>

    <div class="admin-section">
        <h2><i class="fas fa-link"></i> Generator Link Tamu</h2>
        <div class="gen-body">
            <div class="gen-row">
                <input type="text" id="guestInput" placeholder="Nama tamu, cth: Bapak. Mansur (Kepala Desa)">
                <button class="admin-btn btn-maroon" id="btnGen"><i class="fas fa-wand-magic-sparkles"></i> Buat Link</button>
            </div>
            <div class="gen-out hidden" id="linkResult">
                <code id="linkOut"></code>
                <button class="admin-btn btn-export" id="btnCopyLink"><i class="far fa-copy"></i> Salin</button>
                <button class="admin-btn" style="background:#25d366;color:#fff" id="btnWA"><i class="fab fa-whatsapp"></i> Kirim WA</button>
            </div>
        </div>
    </div>

    <div class="admin-section">
        <h2><i class="fas fa-list-check"></i> Daftar RSVP</h2>
        <div style="overflow-x:auto">
            <table class="admin-table">
                <thead><tr><th>Nama</th><th>Status</th><th>Jumlah</th><th>Waktu</th><th></th></tr></thead>
                <tbody id="rsvpBody"></tbody>
            </table>
        </div>
        <p class="empty-state hidden" id="rsvpEmpty" style="color:#999">Belum ada konfirmasi masuk.</p>
    </div>

    <div class="admin-section">
        <h2><i class="fas fa-comments"></i> Ucapan &amp; Doa</h2>
        <div class="admin-list" id="wishBody"></div>
        <p class="empty-state hidden" id="wishEmpty" style="color:#999">Belum ada ucapan.</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
